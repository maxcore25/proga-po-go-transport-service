worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Логирование ───────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;

    # ── Gzip-сжатие ───────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # ── Upstream: Go REST API (порт 9000 внутри контейнера) ───────────
    upstream go_api {
        server 127.0.0.1:9000;
        keepalive 32;
    }

    # ── HTTP → HTTPS редирект ─────────────────────────────────────────
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host:8888$request_uri;
    }

    # ── Основной HTTPS-сервер ─────────────────────────────────────────
    server {
        listen 8888 ssl;
        http2 on;
        server_name localhost;

        # TLS
        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options    nosniff                               always;
        add_header X-Frame-Options           DENY                                  always;
        add_header X-XSS-Protection          "1; mode=block"                       always;

        # ── Swagger UI ────────────────────────────────────────────────
        # gin-swagger сам отдаёт UI; просто проксируем к Go-приложению.
        # Если Swagger нужно отдавать статикой — раскомментируйте блок ниже.
        location /api/v1/swagger {
            proxy_pass         http://go_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
        }

        # ── REST API ──────────────────────────────────────────────────
        location /api/v1 {
            proxy_pass         http://go_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            # Таймауты
            proxy_connect_timeout 10s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        # ── Healthcheck ───────────────────────────────────────────────
        location /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # ── Всё остальное — 404 ───────────────────────────────────────
        location / {
            return 404;
        }
    }
}
